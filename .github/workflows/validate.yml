name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test counter
        run: python -m unittest discover -s tests -v
      - name: Check worked short answer
        run: python scripts/check_limits.py examples/answer-short.txt --max-words 75
